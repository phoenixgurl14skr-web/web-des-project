<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Learn HTML, CSS and JavaScript">

    <meta name="keywords"
          content="HTML, CSS, JavaScript, web development">

    <meta name="author"
          content="Web Development Student">

    <title>Web Development Tutorial</title>

</head>

<body>

<header>

    <h1>Web Development Tutorial</h1>

    <nav aria-label="Main navigation">

        <ul>

            <li>
                <a href="#home">Home</a>
            </li>

            <li>
                <a href="#html">HTML</a>
            </li>

            <li>
                <a href="#css">CSS</a>
            </li>

            <li>
                <a href="#contact">Contact</a>
            </li>

        </ul>

    </nav>

</header>


<main>

<section id="home">

    <h2>Learn Web Development</h2>

    <p>
        Learn how to create modern websites using
        HTML, CSS and JavaScript.
    </p>

    <img
        src="web-development.jpg"
        alt="Web development on a computer">

</section>


<section id="html">

    <h2>HTML</h2>

    <p>
        HTML provides the structure of a webpage.
    </p>

</section>


<section id="css">

    <h2>CSS</h2>

    <p>
        CSS is used to style webpages.
    </p>

</section>


<section id="contact">

    <h2>Contact Us</h2>

    <form>

        <label for="name">
            Name:
        </label>

        <input
            type="text"
            id="name"
            name="name"
            required>


        <br><br>


        <label for="email">
            Email:
        </label>

        <input
            type="email"
            id="email"
            name="email"
            required>


        <br><br>


        <label for="message">
            Message:
        </label>

        <textarea
            id="message"
            name="message"
            rows="5">
        </textarea>


        <br><br>


        <button type="submit">
            Send Message
        </button>

    </form>

</section>

</main>


<footer>

    <p>
        © 2026 Web Development Tutorial
    </p>

</footer>

</body>

</html>
